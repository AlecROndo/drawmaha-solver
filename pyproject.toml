[project]
name = "drawmaha-solver"
version = "0.1.0"
description = "Heads-up pot-limit Drawmaha solver (Deep CFR) with a GTOWizard-style dashboard"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rps-analysis = "drawmaha_solver.rps.analysis:main"
rps-play = "drawmaha_solver.rps.play:main"
kuhn-analysis = "drawmaha_solver.kuhn.analysis:main"
kuhn-play = "drawmaha_solver.kuhn.play:main"
kuhn-exploit-server = "drawmaha_solver.kuhn.exploit_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawmaha_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each rung gets its own tests/<rung>/test_game.py; without importlib mode
# those identical basenames collide at collection time.
addopts = "--import-mode=importlib"
